# model/authorities.toml --- what this repository cites rather than proves.
#
# A `some-true` claim is reproduced from an authority and is not established
# here. This file is where the authority is named well enough for a third party
# to find it, with a checksum over the committed artifact when there is one and
# a stated reason when there is not.
#
# `realized_by` lists the conformance IDs that are *evidence* this repository
# realizes the cited fact. Evidence is not proof, and the meta-gate fails the
# build if any document blurs the two registers.

spec = "template/1"

[[authority]]
id = "CPW-PERFT"
name = "Chess Programming Wiki, Perft Results"
citation = "https://www.chessprogramming.org/Perft_Results"
checksum = "none"
checksum_reason = "A wiki page, not a committed artifact. The five positions and their depth one to three counts are restated in crates/conformance/tests/chess.rs, which builds the requests from the FEN strings itself."
statement = "The number of leaf positions reached by legal play to depths one, two and three from the initial position (20, 400, 8902), Kiwipete (48, 2039, 97862), position 3 (14, 191, 2812), position 4 (6, 264, 9467) and position 5 (44, 1486, 62379)."
realized_by = ["LC-03"]
